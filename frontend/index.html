<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Moodsic — AI Chat (no auth)</title>
  <style>
    body { background: linear-gradient(135deg,#042b2e,#0b4b4f); color:#e6fff7; font-family:system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial; }
    .container { max-width:800px; margin:48px auto; padding:20px; background:rgba(255,255,255,0.03); border-radius:12px; box-shadow:0 6px 30px rgba(0,0,0,0.5); }
    h1 { color:#c9fff0; text-align:center; }
    textarea { width:100%; height:120px; padding:12px; border-radius:8px; border:1px solid rgba(255,255,255,0.06); background:rgba(0,0,0,0.2); color:#e6fff7; resize:vertical; }
    button { background:#00e0a1; color:#00211b; padding:10px 18px; border-radius:8px; border:none; cursor:pointer; font-weight:bold; }
    .response { margin-top:18px; padding:14px; border-radius:8px; background:rgba(255,255,255,0.03); }
    .tags { margin-top:8px; color:#a8f7d1; }
    footer { margin-top:16px; text-align:center; font-size:0.9rem; color:#cceee0; opacity:0.8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Moodsic — Talk to the AI (no login)</h1>
    <p>Type how you feel or what you're thinking, and the AI will suggest music.</p>
    <textarea id="input" placeholder="I feel happy and energetic today..."></textarea>
    <div style="display:flex; gap:10px; margin-top:10px;">
      <button id="analyze">Analyze Mood</button>
      <button id="clear" style="background:#ff7b7b;">Clear</button>
    </div>
    <div id="result" class="response" style="display:none;"></div>
    <footer>Made for demo — no authentication. Connects to backend at <code id="apiUrl"></code></footer>
  </div>
  <script>
    const API_URL = (window.__API_URL__ || "") || (location.origin) + "/api";
    document.getElementById('apiUrl').textContent = API_URL + "/music/analyze";
    const input = document.getElementById('input');
    const btn = document.getElementById('analyze');
    const clear = document.getElementById('clear');
    const result = document.getElementById('result');

    async function analyze() {
      const text = input.value.trim();
      if(!text) { alert("Please write something about how you feel."); return; }
      btn.disabled = true;
      btn.textContent = "Analyzing...";
      try {
        const res = await fetch(API_URL + "/music/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        result.style.display = "block";
        result.innerHTML = "<strong>Mood:</strong> " + (data.analysis?.mood || "unknown") + "<br>";
        result.innerHTML += "<em>" + (data.analysis?.explanation || "") + "</em><br>";
        if(data.recommendations && data.recommendations.length) {
          result.innerHTML += "<div class='tags'><strong>Recommendations:</strong><ul>";
          data.recommendations.forEach(r => result.innerHTML += "<li>" + r + "</li>");
          result.innerHTML += "</ul></div>";
        }
      } catch (err) {
        result.style.display = "block";
        result.innerHTML = "<strong>Error:</strong> " + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Analyze Mood";
      }
    }

    btn.addEventListener('click', analyze);
    clear.addEventListener('click', () => { input.value=''; result.style.display='none'; });
  </script>
</body>
</html>
